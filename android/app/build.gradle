plugins { id 'com.android.application' }

def vCode = (project.findProperty('vCode') ?: '1') as Integer

android {
    namespace 'com.ivansaborido.presupladur'
    compileSdk 34
    defaultConfig {
        applicationId 'com.ivansaborido.presupladur'
        minSdk 24
        targetSdk 34
        versionCode vCode
        versionName "1.${vCode}"
    }
    signingConfigs {
        release {
            // La firma tiene que ser siempre la misma para que las actualizaciones
            // se instalen encima sin borrar los presupuestos guardados.
            storeFile file('../presupladur.keystore')
            storePassword 'nCQJ3ZRDjVxRWOJ0kH-AH57P'
            keyAlias 'presupladur'
            keyPassword 'nCQJ3ZRDjVxRWOJ0kH-AH57P'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.13.1'
}
